<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ExamJunction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:390px;
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:10px;
  padding:28px 22px;
}

.logo{
  text-align:center;
  font-size:24px;
  font-weight:800;
  color:#1264e8;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#667085;
  font-size:13px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input{
  width:100%;
  height:45px;
  border:1px solid #d9dee7;
  border-radius:6px;
  padding:0 12px;
  font-size:14px;
  outline:none;
  margin-bottom:16px;
}

input:focus{
  border-color:#1264e8;
}

.login-btn{
  width:100%;
  height:45px;
  border:0;
  border-radius:6px;
  background:#1264e8;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#1264e8;
  text-decoration:none;
  font-size:13px;
}

.note{
  margin-top:22px;
  padding:11px;
  background:#f5f7fb;
  border-radius:6px;
  color:#667085;
  font-size:11px;
  line-height:1.5;
  text-align:center;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">ExamJunction</div>

  <p class="subtitle">
    Login to continue your preparation
  </p>

  <form onsubmit="loginDemo(event)">

    <label>Email / Mobile</label>

    <input
      type="text"
      placeholder="Enter email or mobile number"
      required
    >

    <label>Password</label>

    <input
      type="password"
      placeholder="Enter password"
      required
    >

    <button class="login-btn" type="submit">
      Login
    </button>

  </form>

  <a href="index.html" class="back">
    ← Back to Home
  </a>

  <div class="note">
    Login system abhi demo interface hai.
    Real authentication baad mein connect hogi.
  </div>

</div>

<script>
function loginDemo(event){
  event.preventDefault();
  alert("Login system abhi setup nahi hua hai.");
}
</script>

</body>
</html>
