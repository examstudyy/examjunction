<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamJunction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f6f8fc;
  color:#172033;
  padding-bottom:70px;
}

/* HEADER */
.header{
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#1264e8;
}

.login{
  text-decoration:none;
  color:#1264e8;
  font-size:14px;
  font-weight:600;
}

/* HERO */
.hero{
  background:#0d1b35;
  color:#fff;
  padding:28px 18px;
}

.hero h1{
  font-size:25px;
  margin-bottom:7px;
}

.hero p{
  color:#cbd5e1;
  font-size:13px;
}

/* MAIN */
.container{
  max-width:850px;
  margin:auto;
  padding:25px 16px;
}

.title{
  font-size:20px;
  margin-bottom:14px;
}

/* CATEGORY */
.category{
  display:block;
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:9px;
  padding:18px;
  margin-bottom:11px;
  text-decoration:none;
  color:#172033;
}

.category-row{
  display:flex;
  align-items:center;
}

.category-icon{
  width:44px;
  height:44px;
  border-radius:8px;
  background:#eaf2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-right:13px;
}

.category-info{
  flex:1;
}

.category-info h3{
  font-size:16px;
  margin-bottom:5px;
}

.category-info p{
  font-size:12px;
  color:#737d8d;
}

.arrow{
  color:#1264e8;
  font-size:22px;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.bottom a{
  text-decoration:none;
  color:#667085;
  text-align:center;
  font-size:11px;
  line-height:20px;
}

.bottom .active{
  color:#1264e8;
  font-weight:700;
}

@media(min-width:700px){
  .bottom{
    display:none;
  }

  .category:hover{
    border-color:#1264e8;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">
    ExamJunction
  </div>

  <a href="#" class="login">
    Login
  </a>

</header>


<!-- HERO -->
<section class="hero">

  <h1>Padhai. Practice. Progress.</h1>

  <p>
    Apni exam preparation ek jagah se shuru karo.
  </p>

</section>


<!-- BATCH CATEGORIES -->
<main class="container">

  <h2 class="title">
    Batches
  </h2>


  <!-- RAILWAY -->
  <a href="batches.html" class="category">

    <div class="category-row">

      <div class="category-icon">
        🚆
      </div>

      <div class="category-info">
        <h3>Railway</h3>
        <p>Railway exam preparation</p>
      </div>

      <div class="arrow">›</div>

    </div>

  </a>


  <!-- SSC -->
  <a href="#" class="category">

    <div class="category-row">

      <div class="category-icon">
        📝
      </div>

      <div class="category-info">
        <h3>SSC</h3>
        <p>SSC exam preparation</p>
      </div>

      <div class="arrow">›</div>

    </div>

  </a>


  <!-- COMPETITIVE -->
  <a href="#" class="category">

    <div class="category-row">

      <div class="category-icon">
        🎯
      </div>

      <div class="category-info">
        <h3>Competitive Exams</h3>
        <p>Other competitive exam preparation</p>
      </div>

      <div class="arrow">›</div>

    </div>

  </a>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom">

  <a href="index.html" class="active">
    🏠<br>
    Home
  </a>

  <a href="batches.html">
    📚<br>
    Batches
  </a>

  <a href="#">
    📄<br>
    Material
  </a>

  <a href="#">
    💼<br>
    Jobs
  </a>

</nav>

</body>
</html>
